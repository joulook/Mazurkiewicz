name = "Mazurkiewicz"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Mazurkiewicz"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
weak.linter.style.header = false # no copyright header required in this learning repo

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc1"

[[lean_lib]]
name = "Mazurkiewicz"
